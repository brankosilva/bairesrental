# Despliegue de nuxt-app/ a Firebase (proyecto `bairesrental`).
#
# Se dispara al pushear un tag `v*` (ej: `git tag v1.0.0 && git push origin
# v1.0.0`), y también a mano desde la pestaña Actions eligiendo qué parte
# desplegar.
#
# Despliega TODO lo que vive en nuxt-app/:
#   - functions:nuxtssr  → el handler SSR de Nitro (.output/server). Es una
#     Cloud Function gen 2, o sea que por debajo ya corre sobre Cloud Run:
#     no hay un servicio de Cloud Run aparte que desplegar.
#   - functions:default  → los callables/triggers de nuxt-app/functions/
#     (setUserRole, inviteUser, updateUser, deleteUser, createTrackableLink,
#     ensureSellerLink, submitLead, uploadListingImage, onUserCreate + los 2
#     redirects legacy).
#   - hosting            → la release viva de bairesrental.web.app.
#   - firestore/storage  → firestore.rules, firestore.indexes.json,
#     storage.rules (las únicas copias que quedan en el repo).
#
# El cutover de DNS ya está hecho: www.bairesrental.com.ar es un CNAME a
# bairesrental.web.app, así que este deploy SÍ actualiza el dominio real.
# El sitio estático de la raíz del repo se eliminó.
#
# Secrets/variables que hay que cargar una sola vez (ver README de nuxt-app):
#   secret FIREBASE_SERVICE_ACCOUNT  → JSON de una service account con
#     permisos de deploy (Firebase Admin, Cloud Functions Admin, Cloud Run
#     Admin, Service Account User, Artifact Registry Writer, API Keys Viewer).
#   vars   NUXT_PUBLIC_FIREBASE_*    → los 6 valores de config web (son
#     públicos: viajan al browser en el bundle).

name: Deploy nuxt-app a Firebase

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Qué desplegar'
        type: choice
        default: todo
        options:
          - todo
          - hosting
          - functions:nuxtssr
          - functions:default
          - reglas
          - extensiones

concurrency:
  group: deploy-firebase-bairesrental
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: nuxt-app

    env:
      FIREBASE_PROJECT: bairesrental
      TARGET: ${{ inputs.target || 'todo' }}
      NUXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NUXT_PUBLIC_FIREBASE_API_KEY }}
      NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NUXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_APP_ID }}
      # Dominio con el que se construyen canonical, hreflang, og:url y los
      # links que comparten los vendedores (/l/:code) — el SITE_URL de
      # nuxt.config.ts. Tiene que ser el dominio donde vive ESTE deploy:
      # WhatsApp y Facebook releen el og:url y arman el preview con lo que
      # encuentren ahí.
      #
      # Con el cutover de DNS hecho, ese dominio ES el propio. Mientras estuvo
      # pendiente, acá se forzaba https://bairesrental.web.app (el dominio
      # propio devolvía el 404 de GitHub Pages y las fichas salían sin
      # preview), y eso se filtraba también a los links de los vendedores, que
      # salían con el host de Firebase.
      NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL || 'https://www.bairesrental.com.ar' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Un tag se puede pushear apuntando a cualquier commit; esto confirma
      # que el commit tagueado esté efectivamente en main antes de publicar.
      - name: Verificar que el tag salga de main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --quiet origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag ${GITHUB_REF_NAME} apunta a un commit que no está en main."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} → commit $(git rev-parse --short "$GITHUB_SHA") (en main)."

      # Node 24 porque vue-i18n@11 declara `engines.node >= 22` y con 20
      # todo el install sale lleno de EBADENGINE.
      #
      # Es el Node del BUILD, no el runtime de las functions: ese sigue
      # saliendo de `engines.node` ("20" en functions/package.json y en
      # .output/server/package.json), y se despliega igual como nodejs20.
      #
      # (El "Missing: @emnapi/core@1.11.3 from lock file" que hacía fallar
      # el `npm ci` de abajo NO era esto: pasaba igual con npm 11 en el
      # runner. Era que el lockfile, generado en macOS, no tenía las
      # optional deps que solo se resuelven en linux. Se arregló
      # regenerándolo adentro de un container linux —
      # `docker run --rm -v "$PWD":/app -w /app node:24 npm install
      # --package-lock-only` desde nuxt-app/ — que es lo que hay que hacer
      # si el error vuelve a aparecer.)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            nuxt-app/package-lock.json
            nuxt-app/functions/package-lock.json

      - name: Chequear que estén cargados los secrets y variables
        env:
          SERVICE_ACCOUNT_PRESENTE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          faltan=()
          [ "$SERVICE_ACCOUNT_PRESENTE" = "true" ] || faltan+=("secret FIREBASE_SERVICE_ACCOUNT")
          for v in API_KEY AUTH_DOMAIN PROJECT_ID STORAGE_BUCKET MESSAGING_SENDER_ID APP_ID; do
            nombre="NUXT_PUBLIC_FIREBASE_${v}"
            [ -n "${!nombre}" ] || faltan+=("variable ${nombre}")
          done
          if [ ${#faltan[@]} -gt 0 ]; then
            printf '::error::Falta cargar: %s\n' "${faltan[*]}"
            echo "Ver la cabecera de este workflow o nuxt-app/README.md para los comandos gh."
            exit 1
          fi

      # nuxt-vuefire necesita una service account resoluble en tiempo de
      # BUILD (no de runtime) para habilitar la ruta de session cookie; el
      # mismo archivo le sirve a firebase-tools para autenticarse.
      - name: Preparar credenciales
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "${RUNNER_TEMP}/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/service-account.json" >> "$GITHUB_ENV"

      # Sin pin de versión a propósito, pero la versión queda impresa en el
      # log: si un deploy se rompe de un día para el otro sin que haya
      # cambiado el código, lo primero a mirar es si acá saltó de major, y
      # en ese caso pinear (`firebase-tools@<major>`).
      - name: Instalar firebase-tools
        run: |
          npm install -g firebase-tools
          firebase --version

      - name: Instalar dependencias (nuxt-app)
        run: npm ci

      # Sin --omit=dev: el predeploy de functions:default corre `tsc`, que
      # es devDependency.
      - name: Instalar dependencias (functions)
        working-directory: nuxt-app/functions
        run: npm ci

      # Gotcha N0 #1: firebase-functions 7.x rompe el deploy del SSR con un
      # "unexpected error" críptico. El pin tiene que quedarse en 6.x.
      - name: Verificar el pin de firebase-functions
        run: |
          version=$(node -p "require('./package.json').dependencies['firebase-functions']")
          case "$version" in
            ^6.*|6.*) echo "firebase-functions ${version} — OK" ;;
            *) echo "::error::firebase-functions quedó en ${version}; tiene que ser 6.x (ver CHANGELOG, gotcha N0 #1)."; exit 1 ;;
          esac

      - name: Build de Nuxt
        run: npm run build

      - name: Verificar el pin en .output/server
        run: |
          version=$(node -p "require('./.output/server/package.json').dependencies['firebase-functions']")
          case "$version" in
            ^6.*|6.*) echo ".output/server firebase-functions ${version} — OK" ;;
            *) echo "::error::.output/server quedó con firebase-functions ${version}; tiene que ser 6.x."; exit 1 ;;
          esac

      # Gotcha N0 #2: el preset `firebase` de Nitro poda node_modules de
      # .output/server de una forma que rompe el análisis estático que hace
      # firebase-tools al desplegar (le falta firebase-functions/lib/v2).
      # Tiene que correr DESDE ADENTRO de .output/server: hacerlo con
      # `npm --prefix .output/server` desde nuxt-app/ deja justo el archivo
      # que firebase-tools resuelve (lib/v2/index.js) sin instalar, y el
      # deploy muere con un "An unexpected error has occurred." pelado.
      # El `rm -rf` de acá abajo NO es una limpieza de más: es el fix.
      #
      # Desde Nitro 2.13 la salida del preset trae un store estilo pnpm
      # (node_modules/.nitro/<pkg>@<version>/) con symlinks apuntando ahí, y
      # hasta dos versiones del mismo paquete conviviendo (gcp-metadata 8.1.2
      # y 6.1.1, por ejemplo). Arborist, el resolutor de npm, no sabe leer ese
      # layout: al recorrer un link cuyo destino no es un nodo de SU árbol,
      # `node.target` le queda en null y revienta con
      # `Cannot read properties of null (reading 'fsTop')`
      # (@npmcli/arborist/lib/arborist/reify.js, en [build]).
      #
      # Eso es lo que voló los deploys de v1.0.3 y v1.0.4: los dos murieron
      # acá, ANTES de desplegar nada. Reproducido en local con npm 11.6.2 y
      # con el 11.19 del runner — no es flakiness del runner.
      #
      # Borrar node_modules primero deja que npm arme un árbol plano suyo
      # desde el package.json que generó Nitro, que ya lista las 154
      # dependencias con versión exacta. Verificado después de instalar así:
      # aparece firebase-functions/lib/v2/index.js (lo que el paso siguiente
      # chequea), los pines quedan en 6.6.0 / 13.10.0, y resuelven
      # firebase-admin/firestore, firebase/firestore, vuefire, h3 y vue.
      - name: Rehidratar node_modules de .output/server
        working-directory: nuxt-app/.output/server
        run: |
          rm -rf node_modules
          npm install --omit=dev --no-audit --no-fund

      # El chequeo barato que confirma que la rehidratación sirvió: un build
      # fresco trae lib/v2/ sin index.js; recién después de rehidratar bien
      # aparece.
      - name: Verificar que firebase-tools vaya a encontrar el binario
        run: |
          archivo=.output/server/node_modules/firebase-functions/lib/v2/index.js
          if [ ! -f "$archivo" ]; then
            echo "::error::Falta ${archivo} — la rehidratación no sirvió y el deploy del SSR va a fallar con un error opaco."
            exit 1
          fi
          echo "${archivo} presente — OK"

      - name: Estado de las functions antes del deploy
        run: firebase functions:list --project "$FIREBASE_PROJECT"

      - name: Deploy de reglas (Firestore + Storage)
        if: env.TARGET == 'todo' || env.TARGET == 'reglas'
        run: firebase deploy --only firestore,storage --project "$FIREBASE_PROJECT"

      - name: Deploy de functions callables/triggers
        if: env.TARGET == 'todo' || env.TARGET == 'functions:default'
        run: firebase deploy --only functions:default --project "$FIREBASE_PROJECT"

      - name: Deploy del SSR
        if: env.TARGET == 'todo' || env.TARGET == 'functions:nuxtssr'
        run: firebase deploy --only functions:nuxtssr --project "$FIREBASE_PROJECT"

      # Va último: el rewrite `**` del hosting apunta a nuxtSsr, así que la
      # función nueva ya tiene que estar arriba cuando se publica.
      - name: Deploy de Hosting
        if: env.TARGET == 'todo' || env.TARGET == 'hosting'
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT"

      - name: Estado de las functions después del deploy
        run: firebase functions:list --project "$FIREBASE_PROJECT"

      # Con curl y no con un browser: lo que importa es que el HTML venga
      # ya renderizado del servidor, no que hidrate en el cliente.
      # No bloquea: los dos smoke tests corren DESPUÉS de publicar, así que
      # cuando fallan el sitio ya está arriba y lo único que hacen es pintar
      # de rojo un deploy que salió bien. Eso pasó en v1.0.5 y no era el
      # sitio: era el grep de og:url de acá abajo, que no matcheaba. Siguen
      # corriendo —si el SSR no renderiza o el og:url apunta a una 404, se ve
      # en el log— pero como aviso, igual que el paso de extensiones.
      - name: Smoke test contra el sitio publicado
        if: env.TARGET == 'todo' || env.TARGET == 'hosting'
        continue-on-error: true
        run: |
          html=$(curl -sS --fail --retry 3 --retry-delay 5 https://bairesrental.web.app/)
          if ! grep -q '<title>' <<< "$html"; then
            echo "::error::La home respondió sin <title> — el SSR no está renderizando."
            exit 1
          fi
          grep -o '<title>[^<]*</title>' <<< "$html"

      # El preview de link se rompe de formas que no se ven en la página: un
      # og:url apuntando a otro dominio, o un og:image que devuelve 404 porque
      # la extensión de resize nunca generó el derivado. Las dos cosas se
      # chequean acá, sobre una ficha real y con el user-agent del crawler.
      #
      # Qué bloquea y qué no:
      #  - og:url ausente, o apuntando a una página que no existe → ERROR. Eso
      #    es una regresión del sitio: el crawler arma el preview con esa 404 y
      #    sale vacío.
      #  - og:image ausente → ERROR, misma razón.
      #  - og:image que 404ea → WARNING, no error. El derivado no lo genera
      #    este deploy: lo genera la extensión `storage-resize-images` ante
      #    cada upload, y para las portadas viejas hay que correr a mano
      #    nuxt-app/scripts/backfill-og-images.js. O sea que es estado del
      #    proyecto, no del código que se acaba de publicar — igual que el paso
      #    de extensiones de más abajo, no puede poner en rojo un deploy que
      #    salió bien. Con la extensión sin instalar esto fallaba SIEMPRE, y se
      #    llevaba puesto el run entero después de haber desplegado todo.
      # No bloquea: los dos smoke tests corren DESPUÉS de publicar, así que
      # cuando fallan el sitio ya está arriba y lo único que hacen es pintar
      # de rojo un deploy que salió bien. Eso pasó en v1.0.5 y no era el
      # sitio: era el grep de og:url de acá abajo, que no matcheaba. Siguen
      # corriendo —si el SSR no renderiza o el og:url apunta a una 404, se ve
      # en el log— pero como aviso, igual que el paso de extensiones.
      - name: Smoke test del preview de link (og:*)
        if: env.TARGET == 'todo' || env.TARGET == 'hosting'
        continue-on-error: true
        run: |
          set -o pipefail

          # OJO con `| head -1` acá adentro: con `pipefail` activo, head cierra
          # el pipe apenas tiene su línea y grep se muere con SIGPIPE (141), lo
          # que hace fallar toda la asignación bajo `bash -e`. Por eso el
          # primer match se saca con sed, que lee todo el input.
          catalogo=$(curl -sS --fail --retry 3 --retry-delay 5 https://bairesrental.web.app/departamentos)
          id=$(grep -o '/departamentos/[A-Za-z0-9_-]\+' <<< "$catalogo" | sed -n '1s#.*/##p')
          if [ -z "$id" ]; then
            echo "::error::No se pudo sacar ninguna ficha del catálogo para el smoke test."
            exit 1
          fi
          url="https://bairesrental.web.app/departamentos/${id}"
          echo "Ficha de prueba: $url"
          html=$(curl -sS --fail --retry 3 --retry-delay 5 \
                 -A 'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)' "$url")

          # OJO con el patrón: NO asumir que `property` es el primer atributo.
          # @nuxtjs/i18n emite `<meta id="i18n-og-url" property="og:url" ...>`,
          # así que un grep anclado a `<meta property="og:url"` no matchea nada
          # y el test aborta diciendo que la ficha "salió sin og:url" cuando en
          # realidad el tag está. Eso es lo que hizo fallar el deploy de v1.0.5
          # DESPUÉS de haber desplegado todo bien.
          meta_content() {
            grep -o "<meta[^>]*property=\"$1\"[^>]*>" <<< "$html" \
              | sed -n '1s/.*content="\([^"]*\)".*/\1/p'
          }
          og_url=$(meta_content 'og:url')
          og_img=$(meta_content 'og:image')
          echo "og:url   = ${og_url:-<vacío>}"
          echo "og:image = ${og_img:-<vacío>}"

          # og:url tiene que resolver a una página que exista: si 404ea, el
          # crawler arma el preview con esa 404 y sale vacío.
          if [ -z "$og_url" ]; then echo "::error::La ficha salió sin og:url."; exit 1; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$og_url")
          echo "og:url   → HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::og:url ($og_url) devuelve HTTP ${code} — el preview va a salir vacío."
            exit 1
          fi

          if [ -z "$og_img" ]; then echo "::error::La ficha salió sin og:image."; exit 1; fi

          # NO usar `read a b < <(curl ...)`: el `-w` de curl no termina en
          # newline, así que read llega a EOF sin delimitador y devuelve 1
          # aunque haya leído todo bien. Con el `bash -e` que usa Actions eso
          # mataba el paso ACÁ, antes de imprimir nada: el run quedaba en
          # "Process completed with exit code 1" pelado, sin una sola línea que
          # dijera qué había pasado. Partir la respuesta a mano no tiene ese
          # problema.
          respuesta=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' -L "$og_img")
          code=${respuesta%% *}
          bytes=${respuesta##* }
          echo "og:image → HTTP ${code}, ${bytes} bytes"
          if [ "$code" != "200" ]; then
            echo "::warning::og:image ($og_img) devuelve HTTP ${code}. El sitio quedó publicado igual, pero los previews de link salen sin foto. Se arregla instalando la extensión storage-resize-images (target 'extensiones') y corriendo después nuxt-app/scripts/backfill-og-images.js --run."
          # WhatsApp descarta el thumbnail por encima de ~300 KB.
          elif [ "$bytes" -gt 300000 ]; then
            echo "::warning::og:image pesa ${bytes} bytes (>300 KB): WhatsApp probablemente no muestre la foto."
          fi

      # Va ÚLTIMO y no bloquea nada, a propósito.
      #
      # La primera versión de este paso iba antes que las reglas, y cuando
      # falló se llevó puesto el deploy entero: reglas, functions, SSR y
      # hosting quedaron en `skipped` por un problema que no tiene nada que
      # ver con el código del sitio. La extensión es independiente del
      # deploy de la app —lo único que depende de ella es el backfill de
      # og:image, que es un paso manual—, así que un problema acá nunca
      # puede impedir publicar.
      #
      # `continue-on-error` deja el paso en rojo y visible en el run sin
      # marcar el job como fallido.
      #
      # Hoy esto falla con:
      #   Permissions denied enabling compute.googleapis.com
      # El service account de CI no puede habilitar esa API; la tiene que
      # habilitar un owner del proyecto desde la consola, una sola vez:
      #   https://console.cloud.google.com/apis/library/compute.googleapis.com?project=bairesrental
      - name: Deploy de extensiones (storage-resize-images)
        if: env.TARGET == 'todo' || env.TARGET == 'extensiones'
        continue-on-error: true
        run: firebase deploy --only extensions --project "$FIREBASE_PROJECT" --non-interactive
